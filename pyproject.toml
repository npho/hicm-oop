[project]
name = "icm-v281-reproduction"
version = "281"
description = "Collaborator review and reproduction package for ICM v281."
readme = "README.txt"
# Run fingerprints (pipeline/run_integrity.py) record the exact Python version;
# .python-version pins 3.10.14 to match ENVIRONMENT.json.
requires-python = "==3.10.*"
dependencies = [
    "anndata==0.11.4",
    "array-api-compat==1.15.0",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "diptest==0.11.0",
    "exceptiongroup==1.3.1",
    "fonttools==4.59.2",
    "h5py==3.14.0",
    "igraph==1.0.0",
    "joblib==1.5.2",
    "kiwisolver==1.4.9",
    "leidenalg==0.12.0",
    "llvmlite==0.39.1",
    "matplotlib==3.10.9",
    "natsort==8.4.0",
    "networkx==3.4",
    "numba==0.56.4",
    "numpy==1.23.5",
    "packaging==25.0",
    "pandas==1.5.3",
    "patsy==1.0.1",
    "pillow==11.3.0",
    "psutil==7.0.0",
    "pymupdf==1.28.0",
    "pynndescent==0.5.13",
    "pyparsing==3.2.3",
    "pypdf==6.14.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "scanpy==1.9.8",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "seaborn==0.13.2",
    "session-info==1.0.0",
    "setuptools==65.5.0",
    "six==1.17.0",
    "statsmodels==0.14.5",
    "stdlib-list==0.11.1",
    "texttable==1.7.0",
    "threadpoolctl==3.6.0",
    "tqdm==4.67.1",
    "typing-extensions==4.15.0",
    "umap-learn==0.5.5",
    # Headless notebook execution (execute_notebook.py).
    "ipykernel==6.29.5",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
]

[dependency-groups]
dev = [
    "black==24.10.0",
    "ruff==0.9.10",
]

[tool.uv]
package = false
# Hold transitive dependencies at the versions in the tested environment
# (ENVIRONMENT.json) so re-locking cannot drift them.
constraint-dependencies = [
    "appnope==1.0.0",
    "asttokens==3.0.2",
    "attrs==26.1.0",
    "click==8.5.0",
    "comm==0.2.3",
    "debugpy==1.8.22",
    "decorator==5.3.1",
    "executing==2.3.0",
    "fastjsonschema==2.22.2",
    "ipython==8.39.0",
    "jedi==0.20.0",
    "jsonschema-specifications==2025.9.1",
    "jsonschema==4.26.0",
    "jupyter-client==8.10.0",
    "jupyter-core==5.9.1",
    "matplotlib-inline==0.2.2",
    "mypy-extensions==1.1.0",
    "nest-asyncio==1.6.0",
    "parso==0.8.7",
    "pathspec==1.1.1",
    "pexpect==4.9.0",
    "platformdirs==4.12.4",
    "prompt-toolkit==3.0.53",
    "ptyprocess==0.7.0",
    "pure-eval==0.2.4",
    "pygments==2.21.0",
    "pyzmq==27.2.0",
    "referencing==0.37.0",
    "rpds-py==0.30.0",
    "stack-data==0.6.3",
    "tomli==2.5.0",
    "tornado==6.5.10",
    "traitlets==5.16.1",
    "wcwidth==0.9.2",
]

[tool.ruff]
target-version = "py310"
line-length = 88
# Received analysis code stays byte-identical until its review: scripts are
# hashed (pipeline/SHA256_CODE.txt, run receipts) and some launchers patch
# their source text, which reformatting would silently break. Remove a path
# from this list once that part has been reviewed. The notebook is excluded
# because its thread-setup cell must stay ahead of the numerical imports.
extend-exclude = [
    "pipeline/code",
    "pipeline/extensions",
    "pipeline/renderers",
    "pipeline/rebuild*",
    "pipeline/cache",
    "*.ipynb",
]

[tool.ruff.lint]
# PEP 8 (E, W), pyflakes (F), bugbear (B), pyupgrade (UP), simplify (SIM)
# and Google-style docstrings (D). Import sorting (I) is deliberately off:
# many scripts set OPENBLAS/OMP/MKL thread variables before importing
# numerical libraries, and reordering imports would change that.
select = ["E", "W", "F", "B", "UP", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
